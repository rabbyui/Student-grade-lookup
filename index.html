<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Student Grade Lookup</title>

  <style>
    body {
      font-family: Arial, sans-serif;
      background: #f4f6f8;
      margin: 0;
      padding: 0;
    }

    .container {
      max-width: 650px;
      margin: 80px auto;
      background: #ffffff;
      padding: 30px;
      border-radius: 12px;
      box-shadow: 0 4px 14px rgba(0, 0, 0, 0.1);
      text-align: center;
    }

    h2 {
      margin-bottom: 10px;
    }

    p {
      color: #555;
    }

    input {
      width: 90%;
      padding: 12px;
      margin-top: 12px;
      font-size: 16px;
      border: 1px solid #ccc;
      border-radius: 6px;
    }

    button {
      width: 95%;
      padding: 12px;
      margin-top: 18px;
      font-size: 16px;
      border: none;
      border-radius: 6px;
      cursor: pointer;
      background: #222;
      color: white;
    }

    button:hover {
      background: #444;
    }

    #result {
      margin-top: 25px;
      font-size: 18px;
      font-weight: bold;
    }

    .error {
      color: #b00020;
    }

    .success {
      color: #006400;
    }

    table {
      width: 100%;
      margin-top: 20px;
      border-collapse: collapse;
      font-size: 15px;
      color: #222;
    }

    th, td {
      border: 1px solid #ddd;
      padding: 10px;
      text-align: center;
    }

    th {
      background: #f0f0f0;
    }

    td {
      font-weight: normal;
    }
  </style>
</head>
<body>

  <div class="container">
    <h2>Student Grade Lookup</h2>
    <p>Enter your Student ID and PIN to view your grades.</p>
    <p>Dr RABEL B CATAYOC, FRIEdr</p>
    
    <form id="gradeForm">
      <input type="text" id="studentId" placeholder="Student ID" required>
      <input type="password" id="pin" placeholder="PIN" required>
      <button type="submit">Search Grades</button>
    </form>

    <div id="result"></div>
  </div>

  <script>
    const API_URL = "https://script.google.com/macros/s/AKfycbx0i5pOC1PyApp-jtgRvGDssft19NGPDLFFWytHknBEi0mLhi4zko-WO9qLA3uP0rQiOQ/exec";

    document.getElementById("gradeForm").addEventListener("submit", async function(event) {
      event.preventDefault();

      const studentId = document.getElementById("studentId").value.trim();
      const pin = document.getElementById("pin").value.trim();
      const resultDiv = document.getElementById("result");

      resultDiv.className = "";
      resultDiv.textContent = "Searching...";

      try {
        const response = await fetch(`${API_URL}?studentId=${encodeURIComponent(studentId)}&pin=${encodeURIComponent(pin)}`);
        const data = await response.json();

        if (data.found) {
          resultDiv.className = "success";

          let output = `
            <p>Student ID: ${data.studentId}</p>
            <table>
              <thead>
                <tr>
                  <th>Subject</th>
                  <th>Grade</th>
                  <th>Remarks</th>
                </tr>
              </thead>
              <tbody>
          `;

          data.records.forEach(record => {
            output += `
              <tr>
                <td>${record.subject}</td>
                <td>${record.grade}</td>
                <td>${record.remarks}</td>
              </tr>
            `;
          });

          output += `
              </tbody>
            </table>
          `;

          resultDiv.innerHTML = output;

        } else {
          resultDiv.className = "error";
          resultDiv.textContent = data.message;
        }

      } catch (error) {
        resultDiv.className = "error";
        resultDiv.textContent = "Error connecting to the grade database.";
      }
    });
  </script>

</body>
</html>
